[package]
name = "Tanoshi"
version = "0.1.0"
authors = [
  "Ametrine Foundation <business@ametrine.cc>",
  "Noticxs <noticxs@ametrine.cc>",
]
edition = "2024"
description = "A delightful desktop environment, made with love and care."
license = "GPL-3.0-or-later"
repository = "https://github.com/Ametrine-cc/Tanoshi.git"
readme = "README.md"

include = [
  "src/**/*",
  "README.md",
  "LICENSE"
]

[dependencies]
slint = { version = "1.9", features = ["renderer-software"] }
chrono = "0.4"
layer-shika = "0.3.1"

[build-dependencies]
slint-build = "1.9"

